# Lead Docket's own option lists — Marketing Sources, Contact Sources,
# Campaigns… as configured, including unused ones (scripts/audit/leaddocket-lists.ts).
# Read-only GETs on the server; names and ids only. Run from the Actions tab.
name: Lead Docket lists

on:
  workflow_dispatch:

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -4 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read the lists on the server
        run: |
          ssh -4 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/farahi-lead-scraper && npx tsx scripts/audit/leaddocket-lists.ts"
