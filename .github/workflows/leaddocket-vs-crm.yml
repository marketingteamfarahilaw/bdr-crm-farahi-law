# Lead Docket against the CRM, both ways (scripts/audit/leaddocket-vs-crm.ts):
# leads missing from the CRM, and leads the CRM still holds that were deleted in
# Lead Docket. Read-only; Lead Docket ids and reps only — no client names.
name: Lead Docket vs CRM

on:
  workflow_dispatch:

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -4 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Compare on the server
        run: |
          ssh -4 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/farahi-lead-scraper && npx tsx scripts/audit/leaddocket-vs-crm.ts"
